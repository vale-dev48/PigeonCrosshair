<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>PigeonCrosshair</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3441"/>
      <stop offset="1" stop-color="#11161d"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2f7"/>
      <stop offset="1" stop-color="#a3adbc"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2fd6a9"/>
      <stop offset="0.55" stop-color="#5b8cf0"/>
      <stop offset="1" stop-color="#c653e8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#ff5a4f" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff5a4f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="256" height="256" rx="58" fill="url(#bg)"/>
  <rect width="256" height="256" rx="58" fill="url(#glow)"/>
  <rect x="3" y="3" width="250" height="250" rx="55" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Piccione -->
  <g transform="translate(82 140) scale(1.15)">
    <path d="M-26 0 L-56 -10 L-62 12 L-30 20Z" fill="#8792a3"/>
    <path d="M-48 -6 L-56 -10 L-62 12 L-53 15Z" fill="#454f5f"/>
    <g stroke="#ee6a82" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M2 24 L0 38 M-4 38 H7"/>
      <path d="M14 24 L14 38 M9 38 H20"/>
    </g>
    <ellipse cx="-4" cy="6" rx="34" ry="22" fill="url(#body)"/>
    <path d="M8 -4 L33 -6 L38 14 L8 22Z" fill="url(#body)"/>
    <circle cx="27" cy="-14" r="13" fill="url(#body)"/>
    <path d="M11 -3 Q24 -8 37 -3 Q42 8 31 15 Q18 17 9 11Z" fill="url(#sheen)" opacity="0.95"/>
    <path d="M-36 4 Q-14 -14 18 8 Q0 25 -30 20 Q-41 14 -36 4Z" fill="#7b8697"/>
    <path d="M-26 8 Q-8 -2 10 9" fill="none" stroke="#5a6475" stroke-width="2" stroke-linecap="round"/>
    <path d="M38 -18 L54 -11 L38 -7Z" fill="#efbfa9"/>
    <circle cx="30" cy="-16" r="3.4" fill="#ff8f3d"/>
    <circle cx="30.6" cy="-16" r="1.5" fill="#161a20"/>
  </g>

  <!-- Mirino -->
  <g transform="translate(200 104)" fill="none" stroke-linecap="square">
    <g stroke="#0b0e13" stroke-opacity="0.85" stroke-width="10">
      <circle r="21"/>
      <path d="M0 -46 V-12 M0 12 V46 M-46 0 H-12 M12 0 H46"/>
