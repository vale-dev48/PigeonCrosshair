    <g stroke="#ff5a4f" stroke-width="5">
      <circle r="21"/>
      <path d="M0 -44 V-12 M0 12 V44 M-44 0 H-12 M12 0 H44"/>
    </g>
    <circle r="4" fill="#ff5a4f" stroke="#0b0e13" stroke-width="2"/>
